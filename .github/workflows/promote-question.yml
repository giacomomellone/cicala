name: promote-question

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Issue forms cannot assign the dynamic lang:{code} label.
  label-language:
    if: >
      github.event.action == 'opened' &&
      contains(github.event.issue.labels.*.name, 'question-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse language from the issue form
        id: parse
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 tools/promote_issue.py parse
      - name: Add lang label
        if: steps.parse.outputs.lang != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "lang:${{ steps.parse.outputs.lang }}" --color BFD4F2 \
            --description "Question submissions for ${{ steps.parse.outputs.lang }}" || true
          gh issue edit "${{ github.event.issue.number }}" \
            --add-label "lang:${{ steps.parse.outputs.lang }}"
      - name: Reply with the new-language explainer
        if: steps.parse.outputs.new_language == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "Thanks! New languages start in the incubator rather than as direct submissions — see [docs/languages.md](../blob/main/docs/languages.md) for how a language graduates (≥150 native questions, a fluent maintainer, a style guide and a denylist). Open an issue titled \`lang: <code>\` if you want to start one — we'd love that."

  # Report validator results after opening or editing a submission.
  check:
    if: >
      (github.event.action == 'opened' || github.event.action == 'edited') &&
      contains(github.event.issue.labels.*.name, 'question-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Check the submission
        id: check
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -o pipefail
          python tools/promote_issue.py check 2>&1 | tee check-output.txt
      - name: Say what is wrong, or that nothing is
        uses: actions/github-script@v7
        env:
          PASSED: ${{ steps.check.outcome == 'success' }}
          FIRST_LOOK: ${{ github.event.action == 'opened' }}
        with:
          script: |
            const fs = require('fs');
            const passed = process.env.PASSED === 'true';
            const firstLook = process.env.FIRST_LOOK === 'true';

            // A passing edit needs no comment — the label coming off says it.
            if (passed && !firstLook) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: context.issue.number,
                  name: 'needs-changes',
                });
              } catch { /* the label was not on the issue */ }
              return;
            }

            let output = '';
            try { output = fs.readFileSync('check-output.txt', 'utf8'); } catch {}
            const body = passed
              ? [
                  'Thanks! This passes every automatic check — the text rules, the',
                  'deck and tone rules, the per-language denylist, and a check that',
                  'the question is not already in the database.',
                  '',
                  'A maintainer who speaks your language reviews it from here.',
                ].join('\n')
              : [
                  '**This submission cannot be merged as written.**',
                  '',
                  '```',
                  output.slice(-4000) || '(no output captured — see the workflow log)',
                  '```',
                  'Edit the issue above and the check runs again. The rules are in',
                  '[CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) and in your',
                  "language's style guide.",
                ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

            if (!passed) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: ['needs-changes'],
              });
            }

  # On approval: parse the issue, append the entry, run validate --fix, open a
  # PR that requests review from the language's CODEOWNERS and closes the issue
  # on merge.
  promote:
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'question-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Append entry from issue
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -o pipefail
          python tools/promote_issue.py apply 2>&1 | tee promote-output.txt
      - name: Assign id and validate
        run: |
          set -o pipefail
          {
            python tools/validate.py --fix
            python tools/validate.py
          } 2>&1 | tee -a promote-output.txt
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ steps.apply.outputs.pr_title }}
          PR_LANG: ${{ steps.apply.outputs.lang }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          branch="question/issue-${ISSUE_NUMBER}"
          git config user.name "cicala-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add questions/
          git commit -m "$PR_TITLE"
          git push -u origin "$branch" --force
          # printf keeps YAML indentation out of the PR body.
          body=$(printf '%s\n\nCloses #%s\n' \
            "Automated promotion of an approved question submission. Review per questions/${PR_LANG}/STYLE.md, then merge." \
            "$ISSUE_NUMBER")
          gh pr create --title "$PR_TITLE" --body "$body" \
            --label "question-submission"

      # Removing approved allows a corrected submission to be retried.
      - name: Report a failed promotion on the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('promote-output.txt', 'utf8'); } catch {}
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '**Promotion failed, so nothing was merged.**',
                '',
                '```',
                output.slice(-4000) || '(no output captured — see the workflow log)',
                '```',
                'The `approved` label has been removed. Fix the issue body and',
                're-approve to try again.',
              ].join('\n'),
            });
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.issue.number,
                name: 'approved',
              });
            } catch { /* already removed */ }
