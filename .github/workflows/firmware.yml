name: firmware

# Also on questions/ and tools/: the corpus is compiled into the image and the
# suites fold every shipped question at the real panel geometry, so a question
# too long for the screen, or one with a character the renderer cannot draw,
# fails here rather than on a table. A question change really can break the
# firmware.
on:
  pull_request:
    paths:
      - "firmware/**"
      - "questions/**"
      - "tools/**"
      - ".github/workflows/firmware.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "questions/**"
      - "tools/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

# Not the ghcr.io/zephyrproject-rtos/ci image the justfile uses locally: it is
# about 20 GB and a standard runner has ~14 GB free, so every job died in
# `Initialize containers` with "no space left on device". The setup action
# installs west and only the toolchains named below, and caches both.
jobs:
  # The suites, on the platform the tree already calls the CI one. No espressif
  # blobs and no cross toolchain: native_sim builds with the host compiler.
  suites:
    name: suites (native_sim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # app-path is the manifest repo, so `west init -l firmware` makes the
      # checkout the west topdir and deps/ lands inside it — the same shape
      # `just fw-init` produces locally, and the one .gitignore expects.
      - name: Set up Zephyr and west
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          toolchains: x86_64-zephyr-elf

      - name: Build the question bundles the suites run against
        run: |
          pip install --quiet pyyaml jsonschema
          python3 tools/build_bundle.py
          mkdir -p firmware/tests/fixtures
          for f in dist/bundles/bundle-*.qdb; do
            lang=$(basename "$f" | cut -d- -f2)
            cp "$f" "firmware/tests/fixtures/$lang.qdb"
          done
          ls -l firmware/tests/fixtures/

      - name: Run the suites
        run: west twister -T firmware/tests -p native_sim --inline-logs -O build/twister

      # The suites build app/src/ but never the application itself, so nothing
      # was checking app/boards/native_sim.overlay. It had been stale since the
      # Category button replaced the selector, and `just fw-sim` on a Linux host
      # was broken the whole time. The POSIX architecture is Linux-only, so this
      # cannot be caught on a macOS bench either.
      - name: Build the application itself for native_sim
        run: west build -b native_sim firmware/app -d build/native_sim

      - name: Keep the twister report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-report
          path: build/twister/twister.xml
          if-no-files-found: ignore

  # What native_sim cannot answer: whether the real image links, and whether it
  # still fits. The second matters more than it looks — sync will add a
  # filesystem and a signature verifier on top of what is already there.
  image:
    name: image (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zephyr and west
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          toolchains: xtensa-espressif_esp32s3_zephyr-elf

      - name: Fetch the espressif Wi-Fi blobs
        run: west blobs fetch hal_espressif

      # `west patch apply` fails on an already-patched tree, which is what a
      # restored cache is. The symbol the patch adds is the honest test of
      # whether the work is done, so ask that rather than trusting an exit code.
      - name: Apply the local Zephyr patches
        run: |
          if grep -q SSD16XX_PRESERVE_IMAGE_ON_INIT \
              deps/zephyr/drivers/display/Kconfig.ssd16xx; then
            echo "patches already applied"
          else
            west patch -b patches -l patches.yml apply
          fi

      - name: Build the question bundles compiled into the image
        run: |
          # imgtool: the sysbuild build signs the application with it, and its
          # absence surfaces as a build failure inside mcuboot.cmake rather
          # than as a missing package.
          pip install --quiet pyyaml jsonschema imgtool
          python3 tools/build_bundle.py
          mkdir -p firmware/tests/fixtures
          for f in dist/bundles/bundle-*.qdb; do
            lang=$(basename "$f" | cut -d- -f2)
            cp "$f" "firmware/tests/fixtures/$lang.qdb"
          done

      # --sysbuild: the bootloader is part of the product now, and a build
      # without it would not catch a change that breaks MCUboot's own build or
      # pushes it past its 64 KB partition. Signed with the committed
      # development key here; a release re-signs with the secret. See
      # firmware/keys/README.md.
      - name: Build for the ESP32-S3 devkit (bootloader + application)
        run: |
          west build -b esp32s3_devkitc/esp32s3/procpu firmware/app \
            -d build/esp32s3 --sysbuild

      # slot0 is 1344 KB and boot_partition is 64 KB
      # (dts/vendor/espressif/partitions_0x0_amp_4M.dtsi). Both reported every
      # run, not only when they fail, so the numbers move visibly rather than
      # being noticed at a flash — and the bootloader is the tighter of the two.
      - name: Check both images still fit their partitions
        run: |
          app_limit=$((1344 * 1024))
          boot_limit=$((64 * 1024))
          app=$(stat -c %s build/esp32s3/app/zephyr/zephyr.signed.bin)
          boot=$(stat -c %s build/esp32s3/mcuboot/zephyr/zephyr.bin)
          app_pct=$((app * 100 / app_limit))
          boot_pct=$((boot * 100 / boot_limit))

          {
            echo "### Image size"
            echo "\`zephyr.signed.bin\` is $app B of $app_limit B (${app_pct}% of slot0_partition)."
            echo "MCUboot is $boot B of $boot_limit B (${boot_pct}% of boot_partition)."
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0

          if [ "$app" -gt "$app_limit" ]; then
            echo "::error::the signed image is $app B, over the $app_limit B slot0_partition"
            fail=1
          fi

          if [ "$boot" -gt "$boot_limit" ]; then
            echo "::error::MCUboot is $boot B, over the $boot_limit B boot_partition"
            fail=1
          fi

          echo "app $app B of $app_limit B (${app_pct}%), mcuboot $boot B of $boot_limit B (${boot_pct}%)"
          exit $fail
