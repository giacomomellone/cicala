name: firmware

# The image embeds the corpus, and layout tests cover every shipped question.
on:
  pull_request:
    paths:
      - "firmware/**"
      - "questions/**"
      - "tools/**"
      - ".github/workflows/firmware.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "questions/**"
      - "tools/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: suites (native_sim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep deps/ inside the checkout, as used by local builds.
      - name: Set up Zephyr and west
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          toolchains: x86_64-zephyr-elf

      - name: Build the question bundles the suites run against
        run: |
          pip install --quiet pyyaml jsonschema
          python3 tools/build_bundle.py
          mkdir -p firmware/tests/fixtures
          for f in dist/bundles/bundle-*.qdb; do
            lang=$(basename "$f" | cut -d- -f2)
            cp "$f" "firmware/tests/fixtures/$lang.qdb"
          done
          ls -l firmware/tests/fixtures/

      - name: Run the suites
        run: west twister -T firmware/tests -p native_sim --inline-logs -O build/twister

      # The library suites do not validate the complete native_sim overlay.
      - name: Build the application itself for native_sim
        run: west build -b native_sim firmware/app -d build/native_sim

      - name: Keep the twister report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-report
          path: build/twister/twister.xml
          if-no-files-found: ignore

  image:
    name: image (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zephyr and west
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          toolchains: xtensa-espressif_esp32s3_zephyr-elf

      - name: Fetch the espressif Wi-Fi blobs
        run: west blobs fetch hal_espressif

      # Restored caches may already contain the patch.
      - name: Apply the local Zephyr patches
        run: |
          if grep -q SSD16XX_PRESERVE_IMAGE_ON_INIT \
              deps/zephyr/drivers/display/Kconfig.ssd16xx; then
            echo "patches already applied"
          else
            west patch -b patches -l patches.yml apply
          fi

      - name: Build the question bundles compiled into the image
        run: |
          # Sysbuild uses imgtool to sign the application.
          pip install --quiet pyyaml jsonschema imgtool
          python3 tools/build_bundle.py
          mkdir -p firmware/tests/fixtures
          for f in dist/bundles/bundle-*.qdb; do
            lang=$(basename "$f" | cut -d- -f2)
            cp "$f" "firmware/tests/fixtures/$lang.qdb"
          done

      # Sysbuild checks the bootloader and application together.
      - name: Build for the ESP32-S3 devkit (bootloader + application)
        run: |
          west build -b esp32s3_devkitc/esp32s3/procpu firmware/app \
            -d build/esp32s3 --sysbuild

      # slot0 is 1344 KB; boot_partition is 64 KB.
      - name: Check both images still fit their partitions
        run: |
          app_limit=$((1344 * 1024))
          boot_limit=$((64 * 1024))
          app=$(stat -c %s build/esp32s3/app/zephyr/zephyr.signed.bin)
          boot=$(stat -c %s build/esp32s3/mcuboot/zephyr/zephyr.bin)
          app_pct=$((app * 100 / app_limit))
          boot_pct=$((boot * 100 / boot_limit))

          {
            echo "### Image size"
            echo "\`zephyr.signed.bin\` is $app B of $app_limit B (${app_pct}% of slot0_partition)."
            echo "MCUboot is $boot B of $boot_limit B (${boot_pct}% of boot_partition)."
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0

          if [ "$app" -gt "$app_limit" ]; then
            echo "::error::the signed image is $app B, over the $app_limit B slot0_partition"
            fail=1
          fi

          if [ "$boot" -gt "$boot_limit" ]; then
            echo "::error::MCUboot is $boot B, over the $boot_limit B boot_partition"
            fail=1
          fi

          echo "app $app B of $app_limit B (${app_pct}%), mcuboot $boot B of $boot_limit B (${boot_pct}%)"
          exit $fail
