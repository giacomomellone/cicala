name: Google Cloud translation drafts

on:
  workflow_dispatch:
    inputs:
      before_ref:
        description: Commit before the edits to synchronize against current main
        required: true
        type: string
      source_id:
        description: Question ID to use when multiple linked versions were edited
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "questions/*/questions.yaml"

permissions:
  contents: read

concurrency:
  group: google-translation-drafts
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Find target languages
        id: plan
        env:
          BEFORE_REF: ${{ inputs.before_ref || github.event.before }}
          AFTER_REF: ${{ github.sha }}
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          args=()
          if [ -n "$SOURCE_ID" ]; then
            args+=(--source-id "$SOURCE_ID")
          fi
          targets="$(python tools/translate_question.py plan \
            --before-ref "$BEFORE_REF" --after-ref "$AFTER_REF" "${args[@]}")"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  translate:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Create or update translation drafts
        id: draft
        env:
          AFTER_REF: ${{ github.sha }}
          BEFORE_REF: ${{ inputs.before_ref || github.event.before }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          TARGET: ${{ matrix.target }}
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          if [ -z "$GOOGLE_TRANSLATE_API_KEY" ]; then
            echo "GOOGLE_TRANSLATE_API_KEY is not configured as a repository secret" >&2
            exit 1
          fi

          branch="translation/google-$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "origin/$branch"
            git rebase "$AFTER_REF"
          else
            git checkout -b "$branch" "$AFTER_REF"
          fi

          args=()
          if [ -n "$SOURCE_ID" ]; then
            args+=(--source-id "$SOURCE_ID")
          fi
          python tools/translate_question.py apply \
            --before-ref "$BEFORE_REF" --after-ref "$AFTER_REF" --target "$TARGET" "${args[@]}"
          python tools/validate.py --fix
          python tools/validate.py

          git add "questions/$TARGET/questions.yaml"
          if ! git diff --cached --quiet; then
            git commit -m "ci(questions): sync $TARGET translation drafts"
          fi

          if git diff --quiet "$AFTER_REF" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push --force-with-lease --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the review pull request
        if: steps.draft.outputs.changed == 'true'
        env:
          AFTER_REF: ${{ github.sha }}
          BRANCH: ${{ steps.draft.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          gh label create needs-native-review \
            --color C5DEF5 \
            --description "Machine translation awaiting a fluent human reviewer" \
            --force

          python - <<'PY'
          import os
          from pathlib import Path

          Path("/tmp/translation-review.md").write_text(
              f"Translation updates for **{os.environ['TARGET']}**, "
              f"from accepted human edits at `{os.environ['AFTER_REF']}`.\n\n"
              "A fluent maintainer must compare each update with its "
              "`translation_sync.source` at that commit and approve it before merge. "
              "`origin` preserves the human-written lineage anchor. Keep "
              "`translated_by: google` and `translation_sync` after review. "
              "Human wording or classification changes during review will synchronize "
              "the other linked translations after merge.\n",
              encoding="utf-8",
          )
          PY

          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file /tmp/translation-review.md --add-label needs-native-review
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "ci(questions): review $TARGET translation updates" \
              --body-file /tmp/translation-review.md \
              --label needs-native-review
          fi
