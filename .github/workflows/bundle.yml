name: bundle

on:
  push:
    tags: ["db-*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate question database
        run: python tools/validate.py
      - name: Build and sign bundles
        env:
          BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#db-}"
          if [ -z "$BUNDLE_SIGNING_KEY" ]; then
            echo "::error::BUNDLE_SIGNING_KEY secret not set — a tagged release cannot be unsigned"
            exit 1
          fi
          printf '%s' "$BUNDLE_SIGNING_KEY" > signing_key.pem
          python tools/build_bundle.py \
            --version "$version" \
            --base-url http://device.cicala.dev/device \
            --sign-key signing_key.pem
          rm -f signing_key.pem
          python tools/check_release.py dist/bundles/manifest.json
      - name: Attach bundles + manifest to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/bundles/* \
            --title "Question database $GITHUB_REF_NAME" \
            --notes "Per-language device bundles + manifest. See docs/sync_protocol.md. The next site deploy serves these under /device/."
