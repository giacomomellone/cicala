name: validate

on:
  pull_request:
    paths:
      - "questions/**"
      - "tools/**"
  push:
    branches: [main]
    paths:
      - "questions/**"
      - "tools/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate question database
        id: validate
        run: |
          set -o pipefail
          python tools/validate.py 2>&1 | tee validate-output.txt
      - name: Run tool tests
        run: python -m unittest discover tools/tests -v
      - name: Comment failures on the PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('validate-output.txt', 'utf8'); } catch {}
            const body = [
              '**Question validation failed.**',
              '',
              '```',
              output.slice(-6000) || '(no output captured — see the workflow log)',
              '```',
              'Tip: run `python tools/validate.py --fix` locally to assign ids/dates,',
              'then fix anything it still reports. See CONTRIBUTING.md.',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
