name: hardware

# KiCad is pinned to 10.0.5 so ERC and DRC results do not move
# between runs. The image also carries the symbol and footprint libraries
# the schematic resolves against.
on:
  pull_request:
    paths:
      - "hardware/**"
      - ".github/workflows/hardware.yml"
  push:
    branches: [main]
    paths:
      - "hardware/**"
      - ".github/workflows/hardware.yml"

permissions:
  contents: read

jobs:
  pcb:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0.5
      # The image runs as the kicad user; checkout needs to own the workspace.
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure the stock KiCad libraries for the CI user
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /home/kicad/.config/kicad/10.0/fp-lib-table "$HOME/.config/kicad/10.0/"
          cp /home/kicad/.config/kicad/10.0/sym-lib-table "$HOME/.config/kicad/10.0/"
      - name: Check the Rev A schematic and board
        env:
          CICALA_PCB_REPORT_DIR: ${{ github.workspace }}/pcb-reports
        run: hardware/tools/rev_a/check_rev_a.sh
      - name: Upload the ERC and DRC reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rev-a-pcb-reports
          path: pcb-reports/
          if-no-files-found: warn

      - name: Check button selection and print orientation logic
        run: |
          python3 -m unittest discover -s hardware/tools/rev_b -p 'test_button_tolerances.py'
          python3 -m unittest discover -s hardware/tools/rev_b -p 'test_print_layout.py'
      - name: Check the Rev B schematic and filled board
        env:
          CICALA_PCB_REPORT_DIR: ${{ github.workspace }}/rev-b-pcb-reports
        run: hardware/tools/rev_b/check_pcb.sh
      - name: Upload the Rev B electrical reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rev-b-pcb-reports
          path: rev-b-pcb-reports/
          if-no-files-found: warn
