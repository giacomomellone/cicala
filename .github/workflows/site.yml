name: site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "website/**"
      - "questions/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tags for the payload version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate question database
        run: python tools/validate.py
      - name: Build site data payloads
        run: python tools/build_site_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm test
          npm run build
      - name: Include latest device bundles under /device (best effort)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 50 --json tagName -q '[.[].tagName | select(startswith("db-"))][0]' || true)
          if [ -n "$tag" ]; then
            mkdir -p website/dist/device
            gh release download "$tag" --dir website/dist/device
            echo "included bundles from $tag"
          else
            echo "no db-* release yet — skipping"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: website/dist
      # Deploy is intentionally the only host-specific step; the build above
      # works on any static host (spec §7.1). Runs only when CF secrets exist.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: website
        run: npx wrangler pages deploy dist --project-name=tischkarte
