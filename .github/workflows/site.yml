name: site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "website/**"
      - "questions/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The device endpoint is a different host from the website, because it
      # has to answer plain HTTP without upgrading. See docs/hosting.md.
      DEVICE_BUCKET: ${{ secrets.DEVICE_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DEVICE_BUCKET_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEVICE_BUCKET_SECRET }}
      AWS_DEFAULT_REGION: ${{ secrets.DEVICE_BUCKET_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tags for the payload version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate question database
        run: python tools/validate.py
      - name: Build site data payloads
        run: python tools/build_site_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm test
          npm run build
      - name: Include latest device bundles under /device (best effort)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 50 --json tagName -q '[.[].tagName | select(startswith("db-"))][0]' || true)
          if [ -n "$tag" ]; then
            mkdir -p website/dist/device
            gh release download "$tag" --dir website/dist/device
            echo "included bundles from $tag"
          else
            echo "no db-* release yet — skipping"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: website/dist
      # Deploy is intentionally the only host-specific step; the build above
      # works on any static host (spec §7.1). Runs only when CF secrets exist.
      # The device fetches from the site, so the release has to be on it. The
      # manifest names /device/<bundle>.qdb and nothing else serves that path —
      # GitHub Releases is where bundles are published, but every asset URL
      # there redirects to another host and Zephyr's HTTP client does not
      # follow redirects. See docs/decisions.md.
      - name: Put the latest question bundles under /device/
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p website/dist/device
          tag=$(gh release list --limit 20 --json tagName \
                  --jq '[.[] | select(.tagName | startswith("db-"))][0].tagName')

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::warning::no db-* release yet, so /device/ will be empty"
            exit 0
          fi

          gh release download "$tag" -D website/dist/device \
            -p 'manifest.json' -p '*.qdb' -p '*.qdb.gz'
          echo "published $tag:"
          ls -l website/dist/device

      # The firmware half of the same idea, and the same reasoning: a device
      # fetches /device/firmware.json and the image that manifest names, and
      # nothing else serves those paths.
      #
      # The bootloader is deliberately NOT published. It is not something a
      # device fetches — it is what a wired first flash needs — and serving it
      # beside the image would invite installing one without the other, which
      # is how a board ends up trusting a key its images are not signed with.
      - name: Put the latest firmware release under /device/
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p website/dist/device
          tag=$(gh release list --limit 20 --json tagName \
                  --jq '[.[] | select(.tagName | startswith("fw-"))][0].tagName')

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::warning::no fw-* release yet, so no firmware is offered"
            exit 0
          fi

          gh release download "$tag" -D website/dist/device \
            -p 'firmware.json' -p 'tischkarte-*.bin'
          echo "published $tag:"
          ls -l website/dist/device

      # Devices fetch from here, not from the Pages deploy above: Pages upgrades
      # every request to HTTPS, and Zephyr's HTTP client does not follow a
      # redirect. The same files go to both — one host for people, one for
      # devices — and this step no-ops until the bucket exists.
      #
      # Cache lifetimes are the point of the two syncs. A manifest cached for
      # an hour is an hour a release does not reach anybody; an image is named
      # after its version and never changes, so it can be cached forever.
      - name: Publish /device/ to the bucket devices fetch from
        if: github.event_name == 'push' && env.DEVICE_BUCKET != ''
        run: |
          aws s3 sync website/dist/device "s3://$DEVICE_BUCKET/device/" \
            --exclude '*' --include 'tischkarte-*.bin' --include '*.qdb' --include '*.qdb.gz' \
            --cache-control 'public, max-age=31536000, immutable' \
            --no-progress

          aws s3 sync website/dist/device "s3://$DEVICE_BUCKET/device/" \
            --exclude '*' --include 'manifest.json' --include 'firmware.json' \
            --cache-control 'public, max-age=60' \
            --no-progress

          echo "published to s3://$DEVICE_BUCKET/device/"

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: website
        run: npx wrangler pages deploy dist --project-name=tischkarte
