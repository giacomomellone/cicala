name: site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "website/**"
      - "questions/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  # Exercise the built HTML, data payloads, and island scripts together.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs tags for the payload version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Build site data payloads
        run: python tools/build_site_data.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the end-to-end suite
        working-directory: website
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: website/playwright-report
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Devices use a separate plain-HTTP endpoint. See docs/hosting.md.
      DEVICE_BUCKET: ${{ secrets.DEVICE_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DEVICE_BUCKET_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEVICE_BUCKET_SECRET }}
      AWS_DEFAULT_REGION: ${{ secrets.DEVICE_BUCKET_REGION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs tags for the payload version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate question database
        run: python tools/validate.py
      - name: Build site data payloads
        run: python tools/build_site_data.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm test
          npm run build
      # Copy release assets into the paths named by the device manifest.
      - name: Put the latest question bundles under /device/
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p website/dist/device
          tag=$(gh release list --limit 20 --json tagName \
                  --jq '[.[] | select(.tagName | startswith("db-"))][0].tagName')

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::warning::no db-* release yet, so /device/ will be empty"
            exit 0
          fi

          gh release download "$tag" -D website/dist/device \
            -p 'manifest.json' -p '*.qdb' -p '*.qdb.gz'
          echo "published $tag:"
          ls -l website/dist/device

      # MCUboot remains a wired-flash release asset.
      - name: Put the latest firmware release under /device/
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p website/dist/device
          tag=$(gh release list --limit 20 --json tagName \
                  --jq '[.[] | select(.tagName | startswith("fw-"))][0].tagName')

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::warning::no fw-* release yet, so no firmware is offered"
            exit 0
          fi

          gh release download "$tag" -D website/dist/device \
            -p 'firmware.json' -p 'cicala-*.bin'
          echo "published $tag:"
          ls -l website/dist/device

      # Capture the same directory that is deployed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-dist
          path: website/dist

      # Artifacts are immutable; manifests use a short cache lifetime.
      - name: Publish /device/ to the bucket devices fetch from
        if: github.event_name == 'push' && env.DEVICE_BUCKET != ''
        run: |
          aws s3 sync website/dist/device "s3://$DEVICE_BUCKET/device/" \
            --exclude '*' --include 'cicala-*.bin' --include '*.qdb' --include '*.qdb.gz' \
            --cache-control 'public, max-age=31536000, immutable' \
            --no-progress

          aws s3 sync website/dist/device "s3://$DEVICE_BUCKET/device/" \
            --exclude '*' --include 'manifest.json' --include 'firmware.json' \
            --cache-control 'public, max-age=60' \
            --no-progress

          echo "published to s3://$DEVICE_BUCKET/device/"

      # --branch must not match the project's production branch, or the deploy
      # lands on the public *.pages.dev hostname. Preview deployments are the
      # only ones the project's Access policy covers. See docs/hosting.md.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: website
        run: npx wrangler pages deploy dist --project-name=cicala --branch=staging
