# FIRMWARE_SIGNING_KEY signs the MCUboot image. BUNDLE_SIGNING_KEY signs the
# image digest in firmware.json. See docs/firmware_update.md.

name: ota

# A dispatch with sync_host builds a release-signed bench artifact.
on:
  push:
    tags: ["fw-*"]
  workflow_dispatch:
    inputs:
      sync_host:
        description: "Bench address to fetch from. Leave EMPTY to cut a real release."
        required: false
        default: ""
        type: string
      sync_port:
        description: "Port it is served on"
        required: false
        default: "8000"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEVICE_BUCKET: ${{ secrets.DEVICE_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DEVICE_BUCKET_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEVICE_BUCKET_SECRET }}
      AWS_DEFAULT_REGION: ${{ secrets.DEVICE_BUCKET_REGION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Work out the version, and check a tag agrees with it
        run: |
          major=$(sed -n 's/^VERSION_MAJOR *= *//p' firmware/app/VERSION)
          minor=$(sed -n 's/^VERSION_MINOR *= *//p' firmware/app/VERSION)
          patch=$(sed -n 's/^PATCHLEVEL *= *//p' firmware/app/VERSION)
          file="$major.$minor.$patch"

          # APP_VERSION_STRING comes from this file.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#fw-}"

            if [ "$version" != "$file" ]; then
              echo "::error::tag $GITHUB_REF_NAME says $version, firmware/app/VERSION says $file"
              exit 1
            fi
          else
            version="$file"
          fi

          echo "version=$version" >> "$GITHUB_ENV"

      # A tag build keeps the production endpoints from board configuration.
      - name: Work out the base URL devices will fetch from
        env:
          SYNC_HOST: ${{ inputs.sync_host }}
          SYNC_PORT: ${{ inputs.sync_port }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ -z "$SYNC_HOST" ]; then
            base="http://device.cicala.dev/device"
            release=true
          else
            base="http://$SYNC_HOST:$SYNC_PORT"
            release=false
            {
              echo "### Bench build"
              echo "This image fetches from \`$base\` and is **not** a release."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "bench_args=-DCONFIG_CICALA_SYNC_HOST=\"$SYNC_HOST\" -DCONFIG_CICALA_SYNC_PORT=$SYNC_PORT -DCONFIG_CICALA_SYNC_BASE_URL=\"$base\" -DCONFIG_CICALA_OTA_BASE_URL=\"$base\"" \
              >> "$GITHUB_ENV"
          fi

          {
            echo "release=$release"
            echo "base_url=$base"
          } >> "$GITHUB_ENV"

      - name: Set up Zephyr and west
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1
        with:
          app-path: firmware
          toolchains: xtensa-espressif_esp32s3_zephyr-elf

      - name: Fetch the espressif Wi-Fi blobs
        run: west blobs fetch hal_espressif

      - name: Apply the local Zephyr patches
        run: |
          if grep -q SSD16XX_PRESERVE_IMAGE_ON_INIT \
              deps/zephyr/drivers/display/Kconfig.ssd16xx; then
            echo "patches already applied"
          else
            west patch -b patches -l patches.yml apply
          fi

      - name: Build the question bundles compiled into the image
        run: |
          # Sysbuild uses imgtool to sign the application.
          pip install --quiet pyyaml jsonschema imgtool
          python3 tools/build_bundle.py
          mkdir -p firmware/tests/fixtures
          for f in dist/bundles/bundle-*.qdb; do
            lang=$(basename "$f" | cut -d- -f2)
            cp "$f" "firmware/tests/fixtures/$lang.qdb"
          done

      # Replace the committed development key when the release secret exists.
      - name: Install the release signing key
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          if [ -n "$FIRMWARE_SIGNING_KEY" ]; then
            printf '%s' "$FIRMWARE_SIGNING_KEY" > firmware/keys/firmware-signing-dev.pem
            echo "signing with the release key"
          elif [ "$release" = "true" ]; then
            echo "::error::FIRMWARE_SIGNING_KEY is not set — a release cannot be signed with the committed development key, whose private half is public"
            exit 1
          else
            echo "::warning::FIRMWARE_SIGNING_KEY is not set — signing with the committed development key, whose private half is public"
          fi

      # bench_args is an unquoted list of CMake flags or an empty value.
      - name: Build the signed image
        run: |
          west build -b esp32s3_devkitc/esp32s3/procpu firmware/app \
            -d build/esp32s3 --sysbuild -- ${bench_args:-}

      - name: Check both images still fit their partitions
        run: |
          app=$(stat -c %s build/esp32s3/app/zephyr/zephyr.signed.bin)
          boot=$(stat -c %s build/esp32s3/mcuboot/zephyr/zephyr.bin)

          if [ "$app" -gt $((1344 * 1024)) ]; then
            echo "::error::the signed image is $app B, over slot0_partition"
            exit 1
          fi

          if [ "$boot" -gt $((64 * 1024)) ]; then
            echo "::error::MCUboot is $boot B, over boot_partition"
            exit 1
          fi

      - name: Describe the release for devices
        env:
          BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
        run: |
          if [ -n "$BUNDLE_SIGNING_KEY" ]; then
            printf '%s' "$BUNDLE_SIGNING_KEY" > signing_key.pem
            python3 tools/build_firmware_manifest.py \
              build/esp32s3/app/zephyr/zephyr.signed.bin \
              --version "$version" --sign-key signing_key.pem \
              --base-url "$base_url"
            rm -f signing_key.pem
          elif [ "$release" = "true" ]; then
            echo "::error::BUNDLE_SIGNING_KEY is not set — the manifest would be unsigned and every device will refuse it"
            exit 1
          else
            echo "::warning::BUNDLE_SIGNING_KEY is not set — the manifest will be UNSIGNED and every device will refuse it"
            python3 tools/build_firmware_manifest.py \
              build/esp32s3/app/zephyr/zephyr.signed.bin \
              --version "$version" --base-url "$base_url"
          fi

      # Wired flashing needs the bootloader that trusts this image's key.
      - name: Put the matching bootloader beside the image
        run: cp build/esp32s3/mcuboot/zephyr/zephyr.bin dist/firmware/mcuboot-${version}.bin

      - name: Check the manifest devices will fetch
        if: github.event_name == 'push' || inputs.sync_host == ''
        run: python3 tools/check_release.py dist/firmware/firmware.json

      - name: Attach the image, the manifest and the bootloader to a Release
        if: github.event_name == 'push' || inputs.sync_host == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A dispatch without a bench host releases the selected commit.
          tag="$GITHUB_REF_NAME"
          target=""

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="fw-$version"
            target="--target $GITHUB_SHA"
          fi

          # A repeated run replaces assets for the same version.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/firmware/* --clobber
          else
            gh release create "$tag" dist/firmware/* $target \
              --title "Firmware $tag" \
              --notes "Signed image, firmware.json and the matching bootloader. See docs/firmware_update.md."
          fi

          echo "released $tag" >> "$GITHUB_STEP_SUMMARY"

      # Bench manifests contain a private host and stay as workflow artifacts.
      - name: Keep the bench build as an artifact instead
        if: github.event_name == 'workflow_dispatch' && inputs.sync_host != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ env.version }}-bench
          path: dist/firmware/
          if-no-files-found: error

      # GITHUB_TOKEN release events do not trigger site.yml, so publish here.
      - name: Publish it where devices will look
        if: (github.event_name == 'push' || inputs.sync_host == '') && env.DEVICE_BUCKET != ''
        run: |
          aws s3 cp dist/firmware/cicala-${version}.bin \
            "s3://$DEVICE_BUCKET/device/cicala-${version}.bin" \
            --cache-control 'public, max-age=31536000, immutable' --no-progress

          # Upload the short-lived manifest after its immutable image.
          aws s3 cp dist/firmware/firmware.json \
            "s3://$DEVICE_BUCKET/device/firmware.json" \
            --cache-control 'public, max-age=60' --no-progress

          echo "devices will find $version at http://$DEVICE_BUCKET/device/" \
            >> "$GITHUB_STEP_SUMMARY"
