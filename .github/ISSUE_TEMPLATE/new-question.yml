name: New question
description: Add a conversation question to the open database. Takes ~30 seconds.
title: "question: "
labels: ["question-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adding to the database! A maintainer who speaks your language reviews every
        submission; once approved it ships to the website within minutes and to every device with
        the next release. Quality bar: answerable without a specific shared relationship, open-ended (no yes/no),
        and specific enough to start a story. See your language's style guide in
        `questions/<lang>/STYLE.md`.
  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Only shipped languages can receive questions directly. Picking "other / new language" gets you an explainer about starting one — see docs/languages.md.
      options:
        - English (en)
        - Deutsch (de)
        - Italiano (it)
        - other / new language
    validations:
      required: true
  - type: dropdown
    id: depth
    attributes:
      label: Depth
      description: Editorial exposure cost, independent of tone. Depth 3 requires the Heavy permission during play.
      options:
        - 1 - little public exposure
        - 2 - a personal construction
        - 3 - vulnerability, conflict, fear, loss, or consequential disclosure
    validations:
      required: true
  - type: input
    id: question-text
    attributes:
      label: Question
      description: 10–140 characters, must end with "?", exactly one question.
      placeholder: When did you last change your mind about something important?
    validations:
      required: true
  - type: dropdown
    id: tags
    attributes:
      label: Tags (optional)
      description: Pick at most one or two. "dark" and "sexual" are independent content restrictions.
      multiple: true
      options:
        - icebreaker
        - reflective
        - sexual
        - dark
        - hypothetical
        - memory
        - wouldyourather
  - type: input
    id: credit
    attributes:
      label: Name for credit (optional)
      description: Free-text credit stored next to the question (max 40 characters). A courtesy, not a legal claim — see below.
  - type: checkboxes
    id: cc0
    attributes:
      label: Public domain dedication
      description: Required. This is what lets the questions ship everywhere, forever.
      options:
        - label: I dedicate this question to the public domain (CC0-1.0). Anyone may use it for any purpose, without attribution.
          required: true
