CONFIG_ZTEST=y

# The blink and pulse periods `depend on TK_STATUS_LED`, which depends on
# TK_POWER, so both have to be on or neither symbol reaches autoconf.h and
# status_led.hpp falls through to its own `#else` literals. They match the
# defaults today, which is exactly why it would go unnoticed: changing a default
# would leave this suite passing against the old value.
CONFIG_TK_POWER=y
CONFIG_TK_STATUS_LED=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y
