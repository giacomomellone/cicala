CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y

CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=144
CONFIG_ZBUS_RUNTIME_OBSERVERS=n

CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# No entropy driver on this core; see app/boards/qemu_xtensa_dc233c.conf.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536

# What the soak image itself sets, at a pace a test can wait out: app/soak.conf
# uses five seconds, which would make this suite a minute long for no extra
# coverage.
CONFIG_TK_DEBUG_SOAK=y
CONFIG_TK_DEBUG_SOAK_INTERVAL_MS=50

# Suppressed the same way the real soak build suppresses it, so the suite fails
# if that stops working. See app/soak.conf.
CONFIG_TK_FULL_REFRESH_INTERVAL=65535
