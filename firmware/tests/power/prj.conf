CONFIG_ZTEST=y

# Not decoration, and not the ADC either. Every threshold in Kconfig.policy
# `depends on TK_POWER`, so without this none of them reaches autoconf.h and
# power_fsm.hpp silently falls through to its own `#else` literals — which match
# the defaults today, so changing a default would leave this suite green against
# the old number. It pulls the ADC subsystem in through `select ADC`; harmless
# with no ADC node, and nothing here reads one.
CONFIG_TK_POWER=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y
