tests:
  tischkarte.smoke:
    # qemu_xtensa/dc233c runs a full Zephyr kernel on macOS and matches the
    # architecture. native_sim is faster and can emulate GPIO, but it only
    # builds on Linux hosts, so it is the CI platform rather than the daily one.
    platform_allow:
      - qemu_xtensa/dc233c
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - qemu_xtensa/dc233c
    tags:
      - tischkarte
      - smoke
