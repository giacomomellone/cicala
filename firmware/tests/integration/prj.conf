CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y

CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# The refresh gate and the LEDs are the seam this suite exists to check: the
# gate lives in app_logic.cpp rather than in a library, so it has no host-only
# home. The ADC is adc_emul, driven from the test.
CONFIG_TK_POWER=y
CONFIG_TK_STATUS_LED=y
CONFIG_ADC=y

# Fast enough that a test can change the emulated voltage and see the device
# notice, rather than waiting out the ten seconds a real device uses. One
# reading per sample for the same reason: averaging a burst is what makes the
# boot reading trustworthy on hardware, and there is no noise to average here.
CONFIG_TK_POWER_SAMPLE_MS=100
CONFIG_TK_POWER_CONFIRM_SAMPLES=1

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=144
CONFIG_ZBUS_RUNTIME_OBSERVERS=n

CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# No entropy driver on this core; see app/boards/qemu_xtensa_dc233c.conf.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
