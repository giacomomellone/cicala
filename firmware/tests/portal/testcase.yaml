tests:
  tischkarte.portal:
    # Bytes in, bytes out: no sockets, no radio, no board features. Deliberately
    # not tagged `net` — qemu_xtensa/dc233c lists that tag under `ignore_tags`,
    # so tagging it would make `just fw-test` skip the suite in silence.
    platform_allow:
      - qemu_xtensa/dc233c
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - qemu_xtensa/dc233c
    tags:
      - tischkarte
      - portal
