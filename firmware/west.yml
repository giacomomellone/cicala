# West manifest (T2 topology: this repo is the manifest repo).

manifest:
  self:
    path: firmware

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: upstream
      revision: v4.4.1
      # path-prefix applies to this project and its imported modules.
      path: zephyr
      import:
        # Keep the west workspace under deps/.
        path-prefix: deps
        # Only what an ESP32-S3 build of this application needs.
        name-allowlist:
          - cmsis
          - hal_espressif   # SoC HAL + Wi-Fi blobs; carries its own xtensa core config
          - hal_xtensa      # xtensa/config/core.h for qemu_xtensa/dc233c host tests
          - picolibc        # default libc
          - mbedtls         # TLS; also pulled in by the Wi-Fi driver
          - tf-psa-crypto   # mbedtls 4 keeps PSA crypto here, and will not configure without it
          - mldsa-native    # referenced by the same mbedtls CMake, alongside tf-psa-crypto
          - littlefs        # question bundle storage
          - mcuboot         # bootloader, for OTA image slots
          - segger          # RTT, for logging without a UART
