# Merged on top of prj.conf and the board .conf only by `just fw-build-soak`
# (and so by fw-soak), never by a plain fw-build. It builds into
# build/esp32s3-soak/, so switching back to the real image is a flash rather
# than a rebuild — the same reasoning as debug.conf.
#
# What this image is for: leaving the device running unattended while it
# refreshes the panel over and over, so ghosting can be watched accumulating.
# See src/soak.c and the bench procedure in docs/hardware_wiring.md.

CONFIG_TK_DEBUG_SOAK=y

# No full refresh for the length of the run — a full one clears the ghosting
# being measured. 65535 is the counter's own ceiling rather than a duration:
# at the default five-second interval it is four days of pressing.
#
# The first render after boot is still full. tk_panel_init() seeds the counter
# with this value, so the run starts from a known image and everything after it
# is partial.
CONFIG_TK_FULL_REFRESH_INTERVAL=65535

# ------------------------------------------------------------------ no radio
# The board conf turns Wi-Fi and the portal on for the everyday image. A
# measurement image wants neither: eight extra threads and a radio beside the
# panel are not what the refresh figures are supposed to describe, and a
# partial refresh has already been seen at 2769 ms during a portal session
# against the 622 ms this rig recorded without one.
CONFIG_TK_NET=n
CONFIG_WIFI=n
CONFIG_NETWORKING=n
