# OpenOCD config for the DevKitC-1's built-in USB-Serial-JTAG, replacing
# deps/zephyr/boards/espressif/esp32s3_devkitc/support/openocd.cfg.
#
# Zephyr's board config is written against Espressif's OpenOCD fork
# (openocd-esp32), but the Zephyr SDK ships upstream OpenOCD 0.12.0. The two
# differ in ways that make the board file fail outright:
#
#   * `source [find interface/esp_usb_jtag.cfg]` -> "Can't find". The fork
#     ships that file; upstream ships only interface/esp_usb_bridge.cfg, for
#     the separate ESP-USB-Bridge board. The esp_usb_jtag *driver* is present
#     either way (`openocd -c "adapter list"`), so the fix is to configure the
#     adapter inline instead of sourcing a file that does not exist.
#   * `set ESP_ONLYCPU 1` is a fork variable name. Upstream's
#     target/esp32s3.cfg reads ESP32_S3_ONLYCPU, so the fork spelling is
#     silently ignored and both cores get attached.
#   * `set ESP_RTOS Zephyr` is likewise fork-only, but nothing is lost: the
#     west runner already passes `-c '$_TARGETNAME_0 configure -rtos Zephyr'`.
#
# Wired up by `just fw-debugserver` via the runner's --config flag.

# One core. The app is single-core (CONFIG_MP_MAX_NUM_CPUS=1) and a second
# attached target only adds a core to step through that never runs our code.
set ESP32_S3_ONLYCPU 1

# The JTAG endpoint of the ESP32-S3's built-in USB-Serial-JTAG peripheral. It
# sits on the DevKitC's *USB* jack; the *UART* jack is the CP2102 bridge used
# for flashing and console, and exposes no JTAG at all.
adapter driver esp_usb_jtag
espusbjtag vid_pid 0x303a 0x1001
espusbjtag caps_descriptor 0x2000
espusbjtag chip_id 9

# Sourced after the adapter exists: this file does `transport select jtag`,
# which needs a driver already selected.
source [find target/esp32s3.cfg]

adapter speed 40000
