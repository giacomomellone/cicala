# Merged on top of prj.conf and the board .conf only by `just fw-build-debug`
# (and so by fw-flash-debug and fw-debugserver), never by a plain fw-build.
# It builds into build/esp32s3-debug/, so the two images never overwrite each
# other and switching between them costs no rebuild.

# -O0, not the -Og of CONFIG_DEBUG_OPTIMIZATIONS: -Og still inlines and
# reorders enough that stepping skips lines and locals read as <optimized out>.
# Per the Kconfig help this can need bigger stacks; the board .conf already
# doubles MAIN_STACK_SIZE, which covers the bring-up app.
CONFIG_NO_OPTIMIZATIONS=y

# CONFIG_DEBUG_THREAD_INFO looks like the obvious companion here and is not:
# it makes the west runner pass `-rtos Zephyr` to OpenOCD, and the upstream
# OpenOCD the SDK ships has no Xtensa entry in its Zephyr compatibility list,
# so the server dies at init with "Could not find target in Zephyr
# compatibility list". Turning it on needs Espressif's openocd-esp32 fork
# first. Left off deliberately — gdb sees one context instead of a thread list.
# CONFIG_DEBUG_THREAD_INFO=y
