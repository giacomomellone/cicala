# Merged on top of prj.conf and the board .conf only by `just fw-build-sleep`,
# never by a plain fw-build. It builds into build/esp32s3-sleep/, so switching
# back to the awake image is a flash rather than a rebuild.
#
# Deep sleep is a reboot: every wake runs main() from the top and the console
# restarts with it. See src/sleep.c.

CONFIG_TK_SLEEP=y

# Zephyr's Espressif port maps PM_STATE_SOFT_OFF to esp_deep_sleep_start(), but
# the state is marked disabled in the SoC devicetree and documented as
# enterable only through pm_state_force() or sys_poweroff(). src/sleep.c calls
# sys_poweroff(); PM_DEVICE is what lets drivers suspend on the way down.
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Light sleep is switched off in sleep.overlay rather than here: it is a
# devicetree power state, not a Kconfig symbol.

# ------------------------------------------------------------------ no radio
# The board conf turns Wi-Fi and the portal on for the everyday image. A
# measurement image wants neither: eight extra threads and a radio beside the
# panel are not what the refresh figures are supposed to describe, and a
# partial refresh has already been seen at 2769 ms during a portal session
# against the 622 ms this rig recorded without one.
CONFIG_TK_NET=n
CONFIG_WIFI=n
CONFIG_NETWORKING=n
