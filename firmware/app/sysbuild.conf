# Sysbuild: the bootloader that makes a firmware update possible.
#
# MCUboot owns boot_partition and decides which of the two 1344 KB image slots
# runs. Without it the ESP32-S3 uses "simple boot", which loads slot0 directly
# and has nowhere to put a downloaded image. See docs/firmware_update.md.

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Ed25519, matching the bundle signatures — one curve in the project rather
# than two, and the smallest verifier of the three MCUboot offers.
#
# This is a DIFFERENT key from the bundle-signing one, and deliberately so: the
# bundle key is compiled into the application and rotates with a firmware
# release, while this one is compiled into the bootloader and can only be
# replaced over the wire on a device that still boots. Different blast radius,
# different key. docs/decisions.md has the reasoning.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y

# Which key, deliberately, is not set here: it needs an absolute path that only
# a Kconfig file can build, so it is in Kconfig.sysbuild next door. What it
# names is a DEVELOPMENT key with its private half in the tree — any image
# signed with it boots on any device flashed with a bootloader built from it.
# CI writes the FIRMWARE_SIGNING_KEY secret over that path before building a
# release, so a released bootloader trusts the production key and nothing else.
# See ../keys/README.md.
