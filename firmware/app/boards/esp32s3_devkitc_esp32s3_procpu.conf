# ESP32-S3-DevKitC-1 breadboard rig.

# Log over the DevKitC's built-in USB-serial, so no extra probe is needed.
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Main stack includes margin above the measured high-water mark.
CONFIG_MAIN_STACK_SIZE=4096

# Report stack high-water marks once per minute.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=60
CONFIG_THREAD_NAME=y

CONFIG_CICALA_NET=y

CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y

# The station and the access point each need one.
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# The portal and sync use IPv4 only.
CONFIG_NET_IPV6=n

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Include scan data in network management events.
CONFIG_NET_MGMT_EVENT_INFO=y

# Allow bursts of network management events.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y

# Advertise the captive DNS server through DHCP.
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"

# Allow up to four concurrent DHCP leases.
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=4

# Skip the ICMP probe before handing out a lease.
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0

# Measured DHCP socket-service usage reached the 2400-byte default.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

# Reserve contexts for DNS, DHCP, HTTP, and accepted clients.
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=16

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# The HTTP server polls one fd per service plus one per client, and the DNS responder holds another.
CONFIG_ZVFS_OPEN_MAX=19
CONFIG_ZVFS_POLL_MAX=16
CONFIG_ZVFS_EVENTFD_MAX=2

CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER=y

# Disable unused cleartext HTTP/2 and minimize its fixed stream array.
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_MAX_STREAMS=1

# A phone opening a captive sheet fires several probes at once.
CONFIG_HTTP_SERVER_MAX_CLIENTS=3

# Fit a typical setup form body in one read.
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024

# The catch-all that makes every captive-detection URL reach the portal.
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_CREDENTIALS_MAX_ENTRIES=3

# net.c controls stored-network attempts and reports their final result.
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=n

CONFIG_HEAP_MEM_POOL_SIZE=65536

# Keep DHCP diagnostics visible during portal setup.
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_INF=y

# Hold the networking startup log burst.
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_CICALA_SYNC=y
CONFIG_HTTP_CLIENT=y
CONFIG_DNS_RESOLVER=y

# Artifact signatures provide authentication over plain HTTP.
CONFIG_CICALA_SYNC_INSECURE=y
CONFIG_CICALA_SYNC_PORT=80

CONFIG_CICALA_OTA=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_CICALA_SLEEP=y

# sleep.c enters ESP32-S3 deep sleep through sys_poweroff().
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# The panel controller is a separate chip on its own rail and sleeps only if asked.
CONFIG_CICALA_PANEL_DEEP_SLEEP=n

# Preserve controller RAM and the displayed image across wake initialization.
CONFIG_SSD16XX_PRESERVE_IMAGE_ON_INIT=y

CONFIG_CICALA_POWER=y

# Red and green outputs use the same pins on the bench and target board.
CONFIG_CICALA_STATUS_LED=y
