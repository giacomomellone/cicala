# ESP32-S3-DevKitC-1 breadboard rig.
# Everything here is development convenience; none of it ships.

# Log over the DevKitC's built-in USB-serial, so no extra probe is needed.
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Larger stacks while bringing up — tighten against measured high-water marks
# before the power bench, not before.
CONFIG_MAIN_STACK_SIZE=4096

# Stack usage reporting; drop once the numbers are known.
#
# THREAD_ANALYZER on its own only makes the analysis available — something has
# to call thread_analyzer_print(), and nothing did, so the numbers this was
# turned on for never appeared. AUTO runs it from its own thread instead.
#
# A minute is slow enough to stay out of the way of the console lines that say
# what the panel is doing, and fast enough that a soak run leaves a few dozen
# samples behind.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=60
CONFIG_THREAD_NAME=y

# Optimization stays at Zephyr's default here, so a plain `just fw-build`
# produces the same code the panel and power work will measure. -O0 for
# stepping lives in ../debug.conf, which only the debug build merges.

# ---------------------------------------------------------- Wi-Fi and portal
# Here rather than in prj.conf because prj.conf is shared with qemu and
# native_sim, which have no radio: CONFIG_WIFI_ESP32 needs a devicetree node
# only this SoC has, and `just fw-sim` would stop building.
#
# The measurement images turn all of this back off — see app/soak.conf and
# app/sleep.conf. A refresh timed with eight extra threads and a radio next to
# the panel is not the number the panel work is after.
CONFIG_TK_NET=y

# ---------------------------------------------------------------------- wifi
# WIFI_NM is not optional here: ESP32_WIFI_AP_STA_MODE depends on it, and that
# is what lets the station and the access point exist at once.
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y

# ----------------------------------------------------------------- networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y

# The station and the access point each need one.
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# Nothing here speaks IPv6: the portal is one hop from a phone and sync is a
# later branch. Off saves flash and RAM on a board where both are the risk.
CONFIG_NET_IPV6=n

# ------------------------------------------------------------------ net_mgmt
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Without this the event callback gets no `info` pointer, so a scan result
# arrives as the fact that a scan result happened.
CONFIG_NET_MGMT_EVENT_INFO=y

# Not the default 5. Events are dropped rather than queued when the queue is
# full — mgmt_push_event logs a warning and moves on — and a scan in a room
# with a dozen access points delivers one event per network in a burst.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# ---------------------------------------------------------------------- dhcp
# Client for the station, server for the access point.
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y

# The one line the captive portal cannot work without. The default is empty,
# and the server then omits option 6 entirely: the phone keeps whatever DNS it
# had, never asks us to resolve anything, and never sees the sign-in sheet.
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"

# One phone at a time is the normal case; four covers a second one joining
# before the first has finished.
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=4

# Skip the ICMP probe before handing out a lease. It costs a second of silence
# per client on a network this device is the only router for.
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0

# The DHCP server runs on the socket-service thread, and the default 2400 bytes
# is not enough to serve a lease: the first run with a phone on the network
# reported this thread at 2400 of 2400 used, the phone associated, and no page
# ever loaded. The upstream apsta sample sets 4096 for the same reason.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

# Not the default 4 — which is what Zephyr picks once IPv6 is off, and which
# this portal spends before a browser has opened anything: one connection each
# for the DNS socket, the DHCP server and the HTTP listener, then one per
# accepted client. A phone opening a captive sheet fires a burst of parallel
# requests, and the first run with one on the network filled the table and
# logged `net_tcp: Cannot allocate a new TCP connection`.
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=16

# ------------------------------------------------------------------- buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# The HTTP server polls one fd per service plus one per client, and the DNS
# responder holds another. The default of 3 is not enough to accept at all.
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_ZVFS_POLL_MAX=16
CONFIG_ZVFS_EVENTFD_MAX=2

# ---------------------------------------------------------------------- http
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER=y

# No browser speaks h2c — HTTP/2 without TLS — so version 2 is code nothing
# reaches. Off, and MAX_STREAMS down to 1, since its array exists regardless.
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_MAX_STREAMS=1

# A phone opening a captive sheet fires several probes at once.
CONFIG_HTTP_SERVER_MAX_CLIENTS=3

# Not the default 256. The form post has to arrive in one piece often enough
# that the split-body path is the exception rather than the rule.
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024

# The catch-all that makes every captive-detection URL reach the portal.
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y

# ------------------------------------------------------------------- storage
# Wi-Fi credentials and the chosen language, in the storage partition the
# ESP32-S3 flash map already defines. No devicetree change: settings_nvs
# targets storage_partition unless a chosen node says otherwise.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_CREDENTIALS_MAX_ENTRIES=3

# Zephyr's own "connect to a stored network" command reports success as soon as
# the *request* is accepted, tries exactly one network, and never falls back.
# src/net.c does its own loop instead.
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=n

# --------------------------------------------------------------------- stacks
# The final heap is the larger of this and the sum of every subsystem's
# HEAP_MEM_POOL_ADD_SIZE_*, so 16 KB was doing nothing: the Wi-Fi driver alone
# asks for 50 KB and won. That left the framebuffer's 4 KB and everything the
# portal allocates coming out of the radio's own budget, and the first run with
# a phone on the network logged `esp32_wifi_adapter: memory allocation failed`.
# This is the driver's 50 KB with room beside it.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# What the DHCP server is doing, since a phone that associates and gets no
# lease looks exactly like a phone that cannot reach the portal.
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_INF=y

# The networking stack announces itself at boot in more lines than the base
# buffer holds, and the first run dropped thirteen of them — including the ones
# saying what the radio did.
CONFIG_LOG_BUFFER_SIZE=4096

# ----------------------------------------------------------------------- sync
# Fetching a bundle needs an HTTP client and a resolver.
CONFIG_TK_SYNC=y
CONFIG_HTTP_CLIENT=y
CONFIG_DNS_RESOLVER=y

# Plain HTTP for now, and this is not the intended end state — see the open
# item in docs/firmware_architecture.md and the decision log.
#
# TLS is written and sits behind CONFIG_TK_SYNC_INSECURE=n, but it does not
# build against the vendored mbedtls 4: enabling the PSA elliptic-curve support
# a public host's handshake needs makes tf-psa-crypto's own psa_crypto_ecp.c
# fail to compile on mbedtls_ecc_group_from_psa, which is a broken combination
# upstream rather than a missing symbol here.
#
# What this costs is confidentiality, not integrity. The ed25519 signature is
# the security boundary in either case — the device has no clock and could not
# authenticate a server even with TLS on — so a tampered bundle is refused
# exactly as before. What an observer gains is knowing that a device fetched a
# question bundle.
CONFIG_TK_SYNC_INSECURE=y
CONFIG_TK_SYNC_PORT=80

# ---------------------------------------------------------------- filesystem
# Where a synced corpus lives, in the partition the overlay adds above the
# 4 MB line. Mounted automatically at /corpus by the fstab node there.
#
# FLASH, FLASH_MAP and FLASH_PAGE_LAYOUT are already on for the NVS holding the
# Wi-Fi credentials; this adds the filesystem on top of them.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# ------------------------------------------------------------------- sleeping
# Deep sleep is a reboot: every wake runs main() from the top and the console
# restarts with it. Everything that has to outlive that is already in RTC
# memory, and the press that ended the sleep is replayed from the wake mask.
# See src/sleep.c.
#
# Here rather than in prj.conf for the reason Wi-Fi is: src/sleep.c is written
# against the Espressif RTC and sleep APIs and does not build for qemu or
# native_sim.
#
# TK_SLEEP is unavailable in the soak and charset images — it depends on
# neither debug symbol being set — because both keep a count in ordinary memory
# across presses and a wake would lose it. debug.conf turns it off by hand,
# because a device that wakes by rebooting loses the debugger every two seconds.
CONFIG_TK_SLEEP=y

# Zephyr's Espressif port maps PM_STATE_SOFT_OFF to esp_deep_sleep_start(), but
# the state is marked disabled in the SoC devicetree and documented as
# enterable only through pm_state_force() or sys_poweroff(). src/sleep.c calls
# sys_poweroff().
#
# PM_DEVICE is not what suspends the drivers on the way down, whatever the
# symbol's name suggests: lib/os/poweroff.c locks interrupts and calls
# z_sys_poweroff() without touching device PM at all, and ssd16xx defines no PM
# action for it to call in any case. Anything that has to be told to sleep has
# to be told explicitly — see panel_controller_sleep() in src/sleep.c. The
# symbol stays because PM_STATE handling wants it, not for the drivers.
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# The panel controller is a separate chip on its own rail and sleeps only if
# asked. Off until the bench says what it saves and what the reviving reset
# costs — see CONFIG_TK_PANEL_DEEP_SLEEP in firmware/Kconfig.policy. Flip to =y
# and rebuild to take the other half of the measurement.
CONFIG_TK_PANEL_DEEP_SLEEP=n

# Not an upstream symbol — added by firmware/patches.yml, so a workspace that
# has not run `just fw-patch` builds an image without it and silently gets a
# white panel on every wake.
#
# ssd16xx clears both controller RAM buffers and drives a full update from its
# init, which on this board runs on every wake, because a wake is a reset. The
# panel was measured spending 2314 ms going white before the application's own
# refresh even began. Skipping that is what lets the retained refresh counter
# mean something: the controller keeps power through deep sleep, so its RAM
# still holds the image that is on the glass.
CONFIG_SSD16XX_PRESERVE_IMAGE_ON_INIT=y


# Light sleep is switched off in the board overlay rather than here: it is a
# devicetree power state, not a Kconfig symbol.
