# qemu_xtensa/dc233c: the application on the host, for `just fw-sim`.
#
# The dc233c core has no entropy driver, so Zephyr's RNG choice — every option
# in it depends on ENTROPY_HAS_DRIVER — is unavailable and sys_rand32_get()
# does not link. The timer-based generator is the way out, and Zephyr's own
# Kconfig says emulation boards are exactly what it is for. It is not random,
# so the bag's draw order under qemu is a sequence rather than a shuffle.
#
# Nothing here reaches the device: the ESP32-S3 has a hardware entropy driver
# and picks a real generator on its own.
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_LOG_MODE_IMMEDIATE=y
