# native_sim: the whole application on the host, with a stub display and
# scripted GPIO. Runs under gdb like any native binary.
#
# What this covers: the state machine, the 600 ms settle window, the
# drop-during-refresh rule, qdb, the bag, and text layout.
# What it cannot cover: timing, power, and the panel itself.

CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=y

# The emulated display writes frames to a buffer the tests can inspect.
CONFIG_DISPLAY=y

# No power management on the host.
CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_THREAD_NAME=y
