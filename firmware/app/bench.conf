# Point sync at a server on the bench instead of at the site.
#
# `just fw-bench HOST` writes the host into this build. Everything else is the
# ordinary image: the same signature check against the same committed key, so
# what this exercises is the real path with a different address on the front of
# it.
#
# Serve the files a release published — manifest.json beside the .qdb it names,
# with the URLs rewritten to point at the bench — and the device will refuse
# anything that has been altered, which is the point of testing it this way.

CONFIG_TK_SYNC_INSECURE=y
