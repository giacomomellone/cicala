# Base application configuration, shared by every board.
# Board-specific additions live in boards/<board>.conf.
#
# Sections marked LATER are the architecture's targets; they are commented out
# until the component they configure exists, so the tree always builds.
# See docs/firmware_architecture.md.

# ------------------------------------------------------------------ language
# C++17 for app logic. No exceptions, no RTTI, nothing allocates.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBCPP=n

# ------------------------------------------------------------------- logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048

# -------------------------------------------------------------------- basics
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_ENTROPY_GENERATOR=y

# Fail loudly in development rather than continuing with a bad state.
CONFIG_ASSERT=y

# ---------------------------------------------------------------- LATER: zbus
# Four state channels and two event channels; every observer is a message
# subscriber so a publish never blocks the publisher.
# CONFIG_ZBUS=y
# CONFIG_ZBUS_CHANNEL_NAME=y
# CONFIG_ZBUS_MSG_SUBSCRIBER=y
# CONFIG_ZBUS_RUNTIME_OBSERVERS=n

# ------------------------------------------------------------- LATER: display
# GDEY0213B74 / SSD1680, 250x122, over SPI. Driver is in-tree.
# CONFIG_SPI=y
# CONFIG_DISPLAY=y
# CONFIG_SSD16XX=y

# ------------------------------------------------------------- LATER: storage
# Decompressed TKB2 bundles; see docs/sync_protocol.md.
# CONFIG_FLASH=y
# CONFIG_FILE_SYSTEM=y
# CONFIG_FILE_SYSTEM_LITTLEFS=y
# CONFIG_NVS=y

# --------------------------------------------------------- LATER: power mgmt
# Deliberately off for the breadboard stage: a device that resets on every
# press is harder to bring up than one that stays awake. Retained state still
# lives in its RTC sections from the first commit, so enabling this is a
# configuration change and not a rewrite.
# CONFIG_PM=y
# CONFIG_PM_DEVICE=y

