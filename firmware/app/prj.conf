# Base application configuration, shared by every board.
# Board-specific additions live in boards/<board>.conf.
#
# Sections marked LATER are the architecture's targets; they are commented out
# until the component they configure exists, so the tree always builds.
# See docs/firmware_architecture.md.

# ------------------------------------------------------------------ language
# C++17 for app logic. No exceptions, no RTTI, nothing allocates.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBCPP=n

# ------------------------------------------------------------------- logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048

# Not the 1024 this architecture defaults to. Deferred logging formats on this
# thread, and the first soak run measured it at 912 bytes used — 89% of the
# default, against 18-38% for every other thread on the board. 112 bytes of
# headroom is not enough to add a log line safely, and the failure mode is a
# stack overflow in the thread that would otherwise report the problem.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# -------------------------------------------------------------------- basics
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536

# The bag picks a question with sys_rand32_get(). On a board with a hardware
# entropy driver — the ESP32-S3 has one — Zephyr then picks a real generator by
# itself. A board without one has no backend at all and the link fails on
# z_impl_sys_rand_get, which is why boards/qemu_xtensa_dc233c.conf asks for the
# testing generator rather than this file doing it for every target.
CONFIG_ENTROPY_GENERATOR=y

# cfb_framebuffer_init() calls k_malloc, and Zephyr's default heap is zero.
# A 250x122 mono buffer is 4000 bytes.
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Fail loudly in development rather than continuing with a bad state.
CONFIG_ASSERT=y

# Why the chip started. Retained state survives a software restart and a
# deep-sleep wake and does not survive a power-on reset, so the reset cause is
# what makes "did the block survive?" a question with a checkable answer rather
# than a guess. Also the first thing worth knowing about a device that came
# back from a brownout in the field.
CONFIG_HWINFO=y

# ----------------------------------------------------------------------- zbus
# Four state channels and two event channels; every observer is a message
# subscriber so a publish never blocks the publisher. Two of the six exist so
# far: chan_selector and chan_next, in src/channels.c.
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=n

# Static allocation has no default: it is the size of the biggest message on
# any channel, and the build fails outright if it is unset. chan_question is
# the biggest — CONFIG_TK_MAX_QUESTION_BYTES of text plus seq, deck and length.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=144

# ---------------------------------------------------------------------- input
# The in-tree gpio-keys driver owns the interrupt and the per-contact debounce
# for the `gpio-keys` nodes in the board overlay; src/input.c adds the one-hot
# rule and the settle window.
CONFIG_INPUT=y

# Not the default, which is INPUT_MODE_THREAD. Synchronous mode runs our
# callback in the context that reported the event — for gpio-keys that is its
# debounce work, so the system workqueue, which is the context the architecture
# assigns to debounce and settle. Saves a thread and its stack, and lets
# src/input.c touch its state without a lock.
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# -------------------------------------------------------------------- display
# GDEY0213B74 / SSD1680, 250x122. In this Zephyr the driver sits behind
# MIPI-DBI rather than on SPI directly, so the transport needs enabling too.
# CFB draws the text; the accents on top of it are src/panel.cpp's own, since
# the bundled fonts stop at ASCII.
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y

