# Bootloader image configuration. Applied on top of MCUboot's own defaults for
# this board; see docs/firmware_update.md.

# The espressif default is silent, which makes a refused image indistinguishable
# from no image at all — the "I (boot): Loading image 0 - slot 0" lines in the
# console come from the SoC port's own printf and say nothing about why an
# update did not happen.
#
# Warnings only, not info. Measured on this board: 57,696 B at WRN against
# 58,496 B at INF, in a 64 KB boot_partition — 88% either way, and that
# partition cannot grow without moving the NVS that holds the Wi-Fi
# credentials. The 800 bytes are worth having because there are only 7.8 KB
# left; the bulk of the bootloader's size is the Ed25519 verification it exists
# to do (37,648 B unsigned). WRN keeps every refusal and drops the chatter.
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y

# Overwrite-only, which is this board's default and is kept deliberately.
#
# The alternative — swap with revert — buys an automatic rollback when a new
# image boots but does not confirm itself. It costs a second copy pass in a
# window where the device must stay powered, and this device deep-sleeps
# between presses, so "boots successfully" is a judgement it makes many times a
# day rather than once. What overwrite-only gives up is recovery from a signed
# image of ours that crashes, which is a release-process failure answered by
# testing before tagging, not by the bootloader. An image that is *not* ours
# never overwrites anything: the signature is checked before the copy starts.
CONFIG_BOOT_UPGRADE_ONLY=y
