# Local changes to the west workspace, applied by `just fw-patch`.

patches:
  - path: zephyr/ssd16xx-preserve-image-on-init.patch
    sha256sum: a72af82552bee82bb99a2379f9855194e3406134fab95dc3bc7f1df270112895
    # Workspace path from the west manifest path-prefix.
    module: deps/zephyr
    author: Giacomo Mellone
    email: giacomo.mellone@gmail.com
    date: 2026-08-05
    upstreamable: true
    comments: >
      An ESP32-S3 deep-sleep wake reinitializes Zephyr while the panel retains
      its image. The default driver clears both RAM buffers and shows white for
      2314 ms. CONFIG_SSD16XX_PRESERVE_IMAGE_ON_INIT preserves the buffers and
      skips that refresh. CONFIG_SSD16XX_PRESERVE_IMAGE_HW_RESET keeps the RES#
      pulse required to wake a controller placed in deep sleep.
