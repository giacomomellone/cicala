site_name: tischkarte
site_description: Docs for the tischkarte conversation-question system — database, website, device.
site_url: https://tischkarte.pages.dev/docs/
repo_url: https://github.com/tischkarte/tischkarte
repo_name: tischkarte/tischkarte
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

nav:
  - overview: index.md
  - design: design.md
  - theory: theory.md
  - device prototype: device_prototype.md
  - prototype bom: prototype_bom.md
  - hardware wiring: hardware_wiring.md
  - firmware primer: firmware_primer.md
  - firmware architecture: firmware_architecture.md
  - patching zephyr: firmware_patches.md
  - decisions: decisions.md
  - languages: languages.md
  - sync protocol: sync_protocol.md
  - firmware updates: firmware_update.md
  - votes (v2): votes.md

# Self-hosted mermaid. Material would otherwise lazy-load it from unpkg; its
# loader is guarded by `typeof mermaid == "undefined"`, and this bundle ends
# with `globalThis["mermaid"] = ...`, so loading it first skips the CDN.
# Fetched by `just docs-deps`, gitignored like any other dependency.
extra_javascript:
  - assets/javascripts/mermaid.min.js

theme:
  name: material
  # no external font loading — same no-third-party ethos as the website
  font: false
  palette:
    scheme: default
    primary: white
    accent: deep orange
  features:
    - navigation.sections
    - content.action.edit
    - toc.integrate

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        # Architecture diagrams are ```mermaid fences: GitHub renders them
        # natively and this makes the docs site render them too.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
